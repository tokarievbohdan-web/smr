<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1024" />
<title>Sport Market Review — Адмінка</title>
<style>
  :root{
    --bg:#F4F6FA;--surface:#FFFFFF;--ink:#16181D;--dim:#5C6370;--muted:#9AA1AE;
    --line:#E6E8EE;--accent:#2F6BFF;--accentSoft:#EAF0FF;--dark:#12141A;--darkline:#242833;
    --ok:#0F7B4E;--okbg:#E4F5EC;--warn:#8A5A00;--warnbg:#FBF0DA;--danger:#B42318;--dangerbg:#FBE9E7;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  a{color:var(--accent)}

  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#e9f0ff,#f4f6fa)}
  .login-card{width:420px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 30px 80px rgba(16,18,24,.08)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .brand b{font-size:16px;letter-spacing:-.3px}
  .login-card h1{font-size:20px;letter-spacing:-.4px;margin:16px 0 4px}
  .login-card p.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:12px 0 6px}
  input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;color:var(--ink);outline:none;font-family:inherit}
  input,select{height:44px} textarea{padding:10px 12px;resize:vertical;min-height:80px}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .btn{height:44px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;width:100%;margin-top:18px}
  .err{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:10px;min-height:16px}
  .quick{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .quick .q-title{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
  .quick .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;text-align:left;font-size:12px;font-weight:600;color:var(--ink)}
  .quick button:hover{border-color:var(--accent);background:var(--accentSoft)}

  #app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  aside{background:var(--dark);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  aside .brand b{color:#fff}
  nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;overflow:auto}
  nav a{display:flex;align-items:center;gap:11px;color:#AEB4C2;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px;font-weight:600}
  nav a .ico{width:18px;text-align:center;opacity:.9}
  nav a:hover{background:var(--darkline);color:#fff}
  nav a.active{background:var(--accent);color:#fff}
  nav a .badge{margin-left:auto;background:#E0532B;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 7px}
  nav a.active .badge{background:rgba(255,255,255,.25)}
  .side-foot{margin-top:auto;border-top:1px solid var(--darkline);padding-top:14px}
  .side-user{display:flex;align-items:center;gap:10px}
  .side-user .av{width:34px;height:34px;border-radius:8px;background:var(--darkline);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .side-user .nm{font-size:12.5px;font-weight:700}
  .side-user .rl{font-size:11px;color:#8892A6}
  .side-foot button{margin-top:12px;width:100%;background:transparent;border:1px solid var(--darkline);color:#AEB4C2;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600}
  .side-foot button:hover{color:#fff;border-color:#3a4150}

  main{padding:24px 28px;overflow:auto;max-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .topbar h2{font-size:22px;letter-spacing:-.5px}
  .topbar .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .role-pill{background:var(--accentSoft);color:var(--accent);font-weight:700;font-size:11.5px;border-radius:999px;padding:5px 11px}

  .grid-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .metric .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  .metric .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:8px}
  .metric .d{font-size:11.5px;font-weight:700;margin-top:4px}
  .metric .d.up{color:var(--ok)}.metric .d.flat{color:var(--muted)}.metric .d.down{color:var(--danger)}
  .section-title{font-size:13px;font-weight:800;margin:24px 0 12px}
  .attention{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .attention .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
  .attention .row:first-child{border-top:none}
  .attention .row .ic{width:34px;height:34px;border-radius:9px;background:var(--warnbg);color:var(--warn);display:flex;align-items:center;justify-content:center;font-size:15px}
  .attention .row .t{font-weight:700;font-size:13.5px}.attention .row .s{font-size:12px;color:var(--dim)}
  .attention .row .cnt{margin-left:auto;font-weight:800;font-size:16px}
  .attention .row .go{margin-left:14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--accent)}

  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs .tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--dim)}
  .tabs .tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input.search{width:230px;height:38px}
  .toolbar select{width:auto;height:38px;padding:0 30px 0 12px}
  .toolbar .spacer{flex:1}
  .toolbar .tbtn{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--ink)}
  .toolbar .tbtn.primary{background:var(--accent);color:#fff;border:none}
  .toolbar .tbtn.warn{color:var(--warn)}.toolbar .tbtn.danger{color:var(--danger)}
  .toolbar .tbtn[disabled]{opacity:.4;cursor:not-allowed}
  .card-table{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line);background:#FBFCFE;white-space:nowrap}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FBFCFE}
  td .name{font-weight:700}td .meta{color:var(--dim);font-size:12px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .badge2{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;border-radius:6px;padding:3px 8px;text-transform:uppercase;white-space:nowrap}
  .b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}
  .b-danger{background:var(--dangerbg);color:var(--danger)}.b-info{background:var(--accentSoft);color:var(--accent)}.b-neutral{background:#EEF0F4;color:var(--dim)}
  .rowact{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:700;color:var(--ink);margin-left:6px}
  .rowact.ok{color:var(--ok)}.rowact.dg{color:var(--danger)}
  .empty{padding:44px;text-align:center;color:var(--muted);font-weight:600;font-size:13.5px}
  .notecell{color:var(--dim);font-size:12px;font-style:italic}
  .notrole{padding:60px;text-align:center;color:var(--muted)}.notrole b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}

  /* Kanban */
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
  .kcol{min-width:230px;flex:1;background:#EEF1F6;border-radius:12px;padding:10px}
  .kcol h4{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between}
  .kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px;cursor:pointer}
  .kcard:hover{border-color:var(--accent)}
  .kcard .kt{font-weight:700;font-size:13px}
  .kcard .km{color:var(--dim);font-size:11.5px;margin-top:3px}
  .kcard .kf{display:flex;align-items:center;gap:6px;margin-top:8px}
  .pri{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px}
  .pri.high{background:var(--dangerbg);color:var(--danger)}.pri.med{background:var(--warnbg);color:var(--warn)}.pri.low{background:#EEF0F4;color:var(--dim)}

  /* Editor */
  .editor{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  .ed-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .ed-side{display:flex;flex-direction:column;gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .panel h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin-bottom:12px}
  .block{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#FBFCFE}
  .block .bh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .block .btype{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--accent);letter-spacing:.3px}
  .block .brm{margin-left:auto;color:var(--muted);border:none;background:none;font-size:14px}
  .addblocks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .addblocks button{border:1px dashed var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--dim)}
  .addblocks button:hover{border-color:var(--accent);color:var(--accent)}
  .wf{display:flex;flex-wrap:wrap;gap:8px}
  .wf button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700}
  .wf button.p{background:var(--accent);color:#fff;border:none}
  .autosave{font-size:11.5px;color:var(--muted);font-weight:600}
  .social{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .social .im{height:90px;background:#EEF1F6;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
  .social .tx{padding:10px}.social .tx .st{font-weight:700;font-size:12.5px}.social .tx .sd{color:var(--dim);font-size:11.5px;margin-top:2px}.social .tx .su{color:var(--muted);font-size:10.5px;margin-top:4px;text-transform:uppercase}
  .switchrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .switch{width:42px;height:24px;border-radius:12px;border:1px solid var(--line);background:#EEF0F4;position:relative;cursor:pointer}
  .switch.on{background:var(--accent);border-color:var(--accent)}
  .switch .k{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9px;background:#fff;transition:.15s}
  .switch.on .k{left:20px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips .c{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer}
  .chips .c.on{background:var(--dark);color:#fff;border-color:var(--dark)}

  #modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(16,18,24,.45);z-index:60;padding:24px}
  #modal-root.show{display:flex}
  .modal{width:480px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:16px;padding:24px}
  .modal.wide{width:640px}
  .modal h3{font-size:18px;letter-spacing:-.3px}
  .modal p{color:var(--dim);font-size:13.5px;line-height:1.5;margin-top:8px}
  .modal .row{display:flex;gap:10px;margin-top:18px}
  .modal .row button{flex:1;height:42px;border-radius:10px;font-weight:700;font-size:13.5px}
  .modal .row .c{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .modal .row .a{background:var(--accent);color:#fff;border:none}
  .modal .row .a.danger{background:var(--danger)}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border:none}.kv .k{color:var(--dim)}
  .hist{font-size:12px;color:var(--dim);padding:5px 0}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:70;display:flex;gap:9px;align-items:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .dot{width:8px;height:8px;border-radius:4px;background:#3FC77E}

  .taxwrap{display:grid;grid-template-columns:220px 1fr;gap:16px}
  .taxlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .taxlist button{width:100%;text-align:left;border:none;background:none;padding:12px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);color:var(--ink)}
  .taxlist button:last-child{border:none}
  .taxlist button.active{background:var(--accentSoft);color:var(--accent)}
  .tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .tpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  .tpl:hover{border-color:var(--accent)}
  .tpl .tt{font-weight:700;font-size:13.5px}.tpl .ts{color:var(--dim);font-size:12px;margin-top:4px}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .formgrid .full{grid-column:1/3}
</style>
</head>

function mountShell(){
  const allowed=PERMS[SESSION.role];
  document.getElementById('nav').innerHTML=NAV.filter(n=>allowed.includes(n.key)).map(n=>{const a=attentionCount(n.key);return `<a href="#" data-k="${n.key}" onclick="go('${n.key}');return false"><span class="ico">${n.ico}</span>${n.label}${a?`<span class="badge">${a}</span>`:''}</a>`;}).join('');
  document.getElementById('su-av').textContent=SESSION.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  document.getElementById('su-name').textContent=SESSION.name;document.getElementById('su-role').textContent=ROLE_LABEL[SESSION.role];
  document.getElementById('role-pill').textContent=ROLE_LABEL[SESSION.role];
}
function attentionCount(k){
  if(k==='users')return USERS.filter(u=>u.status==='pending').length;
  if(k==='organizations')return ORGS.filter(o=>o.status==='pending').length+ACCESS_REQ.length;
  if(k==='articles')return ARTICLES.filter(a=>a.status==='review').length;
  if(k==='opportunities')return OPPS.filter(o=>o.status==='pending').length;
  if(k==='events')return EVENTS.filter(e=>e.status==='pending').length;
  if(k==='reports')return REPORTS.filter(r=>r.status==='open').length;
  if(k==='introductions')return INTROS.filter(i=>i.status==='moreinfo'||i.status==='new').length;
  return 0;
}
function refreshBadges(){document.querySelectorAll('nav a').forEach(a=>{const k=a.dataset.k,c=attentionCount(k),ex=a.querySelector('.badge');if(c&&!ex){a.insertAdjacentHTML('beforeend',`<span class="badge">${c}</span>`);}else if(c&&ex){ex.textContent=c;}else if(!c&&ex){ex.remove();}});}
function go(key){
  if(!PERMS[SESSION.role].includes(key)){V().innerHTML=`<div class="notrole"><b>Недостатньо прав</b>Ваша роль не має доступу до цього розділу.</div>`;return;}
  CUR=key;SELECTED.clear();
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===key));
  const meta=NAV.find(n=>n.key===key);
  document.getElementById('page-title').textContent=meta.label;document.getElementById('page-sub').textContent=SUBTITLES[key]||'';
  audit('Перегляд розділу',meta.label);VIEWS[key]();
}

function introCard(c){return `<div class="kcard" onclick="introModal('${c.id}')"><div class="kt">${esc(c.from)} → ${esc(c.to)}</div><div class="km">${c.reason}</div><div class="kf"><span class="pri ${c.priority}">${c.priority}</span>${c.manager!=='—'?badge('b-info',c.manager.split(' ')[0]):badge('b-neutral','без відп.')}</div></div>`;}
function introModal(id){const c=INTROS.find(x=>x.id===id);
  openModal(`<h3>${esc(c.from)} → ${esc(c.to)}</h3>
  <div style="margin-top:12px"><div class="kv"><span class="k">Причина</span><span>${c.reason}</span></div><div class="kv"><span class="k">Очікуваний результат</span><span>${c.outcome}</span></div><div class="kv"><span class="k">Повʼязана сутність</span><span>${c.related}</span></div><div class="kv"><span class="k">Відповідальний</span><span>${c.manager}</span></div><div class="kv"><span class="k">Пріоритет</span><span class="pri ${c.priority}">${c.priority}</span></div><div class="kv"><span class="k">Email-статус</span><span>${c.email}</span></div><div class="kv"><span class="k">Статус</span><span>${sbadge(c.status)}</span></div></div>
  <label style="margin-top:12px">Внутрішні нотатки</label><textarea id="inote" placeholder="Нотатка">${esc(c.notes)}</textarea>
  <div style="margin-top:8px"><div style="font-size:11px;font-weight:800;color:var(--muted)">ІСТОРІЯ</div>${c.history.map(h=>`<div class="hist">• ${h}</div>`).join('')}</div>
  <div class="wf" style="margin-top:12px">
    <button onclick="iAssign('${id}')">Призначити відп.</button>
    <button onclick="iMove('${id}','moreinfo','Запит інформації')">Запросити інфо</button>
    <button class="p" onclick="iMove('${id}','approved','Схвалено')">Одобрити</button>
    <button onclick="iMove('${id}','declined','Відхилено')">Відхилити</button>
    <button onclick="genEmail('${id}')">Сформувати email</button>
    <button onclick="iMove('${id}','sent','Знайомство надіслано')">Надіслати знайомство</button>

let TAX=Object.keys(TAXONOMIES)[0];
VIEWS.taxonomies=function(){
  V().innerHTML=`<div class="taxwrap"><div class="taxlist">${Object.keys(TAXONOMIES).map(t=>`<button class="${t===TAX?'active':''}" onclick="TAX='${t}';VIEWS.taxonomies()">${t}</button>`).join('')}</div>

  <div class="card-table"><table><thead><tr><th>Значення</th><th>Використання</th><th>Активність</th><th style="text-align:right">Дії</th></tr></thead><tbody>
  ${TAXONOMIES[TAX].map((it,i)=>`<tr><td><div class="name">${it.n}</div></td><td>${it.used?badge('b-info','використовується'):badge('b-neutral','не використовується')}</td><td>${it.active?badge('b-ok','активний'):badge('b-neutral','деактивований')}</td>
    <td style="text-align:right;white-space:nowrap"><button class="rowact" onclick="taxRename(${i})">Перейменувати</button><button class="rowact" onclick="taxMerge(${i})">Обʼєднати</button><button class="rowact" onclick="taxToggle(${i})">${it.active?'Деактивувати':'Активувати'}</button>${it.used?'':`<button class="rowact dg" onclick="taxDelete(${i})">Видалити</button>`}</td></tr>`).join('')}
  </tbody></table></div><p style="font-size:12px;color:var(--muted);margin-top:10px">Значення, що використовується, не можна видалити — лише деактивувати, перейменувати або обʼєднати.</p></div></div>`;
};
function taxAdd(){openModal(`<h3>Додати значення</h3><label>${TAX}</label><input id="txn" placeholder="Нове значення"/><div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a" onclick="const v=document.getElementById('txn').value.trim();if(v){TAXONOMIES['${TAX}'].push({n:v,used:false,active:true});audit('Довідник: додано','${TAX} · '+v);}closeModal();VIEWS.taxonomies();toast('Додано')">Додати</button></div>`);setTimeout(()=>document.getElementById('txn').focus(),50);}
function taxRename(i){const it=TAXONOMIES[TAX][i];openModal(`<h3>Перейменувати</h3><input id="txr" value="${esc(it.n)}"/><div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a" onclick="TAXONOMIES['${TAX}'][${i}].n=document.getElementById('txr').value;audit('Довідник: перейменовано','${TAX}');closeModal();VIEWS.taxonomies();toast('Перейменовано')">Зберегти</button></div>`);}
function taxMerge(i){const it=TAXONOMIES[TAX][i];const others=TAXONOMIES[TAX].filter((_,j)=>j!==i);openModal(`<h3>Обʼєднати «${esc(it.n)}»</h3><label>З яким значенням обʼєднати</label><select id="txm">${others.map(o=>`<option>${o.n}</option>`).join('')}</select><div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a" onclick="audit('Довідник: обʼєднано','${TAX} · ${esc(it.n)}');TAXONOMIES['${TAX}'].splice(${i},1);closeModal();VIEWS.taxonomies();toast('Значення обʼєднано')">Обʼєднати</button></div>`);}
function taxToggle(i){TAXONOMIES[TAX][i].active=!TAXONOMIES[TAX][i].active;audit('Довідник: змінено активність',TAX);VIEWS.taxonomies();toast('Оновлено');}
function taxDelete(i){const it=TAXONOMIES[TAX][i];confirmModal('Видалити значення?',esc(it.n),()=>{TAXONOMIES[TAX].splice(i,1);audit('Довідник: видалено',TAX+' · '+it.n);VIEWS.taxonomies();toast('Видалено');},true);}

/* ============ TABLE ENGINE ============ */
let TSTATE={},TCONTAINER=null;
function table(cfg){TCONTAINER=cfg.container||null;TSTATE={cfg,q:'',filter:''};renderTable();}
function renderTable(){
  const {cfg}=TSTATE;if(!cfg)return;let rows=cfg.rows.slice();
  const host=TCONTAINER||document.getElementById('view');
  if(TSTATE.q){const q=TSTATE.q.toLowerCase();rows=rows.filter(r=>cfg.search(r).toLowerCase().includes(q));}
  if(TSTATE.filter)rows=rows.filter(r=>r.status===TSTATE.filter);
  const f=cfg.filters&&cfg.filters[0];const anySel=SELECTED.size>0;
  host.innerHTML=`<div class="toolbar"><input class="search" placeholder="Пошук…" value="${TSTATE.q}" oninput="tSearch(this.value)"/>
    ${f?`<select onchange="tFilter(this.value)"><option value="">Усі статуси</option>${f.opts.map(o=>`<option ${TSTATE.filter===o?'selected':''} value="${o}">${o}</option>`).join('')}</select>`:''}
    ${cfg.extra||''}<div class="spacer"></div>
    ${(cfg.bulk||[]).map((b,i)=>`<button class="tbtn ${i===1?'danger':''}" ${anySel?'':'disabled'} onclick="bulk('${b}')">${b} ${anySel?`(${SELECTED.size})`:''}</button>`).join('')}
    <button class="tbtn" onclick="exportCsv('${CUR}',TSTATE.cfg.rows)">Експорт CSV</button></div>
  <div class="card-table"><table><thead><tr><th style="width:36px"><input type="checkbox" ${rows.length&&rows.every(r=>SELECTED.has(r.id))?'checked':''} onchange="selAll(this.checked)"/></th>${cfg.cols.map(c=>`<th>${c}</th>`).join('')}<th style="text-align:right">Дії</th></tr></thead>
  <tbody>${rows.length?rows.map(r=>`<tr><td><input type="checkbox" ${SELECTED.has(r.id)?'checked':''} onchange="selRow('${r.id}',this.checked)"/></td>${cfg.cell(r)}<td style="text-align:right;white-space:nowrap">${cfg.actions?cfg.actions(r):''}</td></tr>${NOTES[r.id]?`<tr><td></td><td colspan="${cfg.cols.length+1}"><span class="notecell">📝 ${NOTES[r.id]}</span></td></tr>`:''}`).join(''):`<tr><td colspan="${cfg.cols.length+2}" class="empty">Нічого не знайдено</td></tr>`}</tbody></table></div>`;
}
function tSearch(v){TSTATE.q=v;renderTable();}
function tFilter(v){TSTATE.filter=v;renderTable();}
function selRow(id,on){on?SELECTED.add(id):SELECTED.delete(id);renderTable();}
function selAll(on){TSTATE.cfg.rows.forEach(r=>on?SELECTED.add(r.id):SELECTED.delete(r.id));renderTable();}
function bulk(label){confirmModal(label+'?',`Дію буде застосовано до ${SELECTED.size} записів.`,()=>{audit('Масова дія: '+label,SELECTED.size+' записів');SELECTED.clear();toast(label+' — виконано');renderTable();});}

/* ============ ACTIONS / MODAL / TOAST / EXPORT ============ */
function act(action,target){audit(action,target);toast(action);refreshBadges();if(TSTATE.cfg)renderTable();}
function confirmAct(title,target,action){confirmModal(title,'Підтвердьте дію — вона буде записана в аудит.',()=>{audit(action,target);toast(action);refreshBadges();if(TSTATE.cfg)renderTable();},true);}
function noteFor(id,name){openModal(`<h3>Внутрішня нотатка</h3><p>${name}</p><textarea id="note-in" placeholder="Нотатка">${NOTES[id]||''}</textarea><div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a" onclick="saveNote('${id}','${name}')">Зберегти</button></div>`);setTimeout(()=>document.getElementById('note-in').focus(),50);}
function saveNote(id,name){NOTES[id]=document.getElementById('note-in').value.trim();audit('Внутрішня нотатка',name);closeModal();toast('Нотатку збережено');if(TSTATE.cfg)renderTable();}
function openModal(html){document.getElementById('modal').className='modal'+(html.includes('class="wide"')||arguments[1]==='wide'?' wide':'');document.getElementById('modal').innerHTML=html;document.getElementById('modal-root').classList.add('show');}
function closeModal(){document.getElementById('modal-root').classList.remove('show');}
function confirmModal(title,msg,onOk,danger){openModal(`<h3>${title}</h3><p>${msg}</p><div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a ${danger?'danger':''}" id="cm-ok">Підтвердити</button></div>`);document.getElementById('cm-ok').onclick=()=>{closeModal();onOk();};}
let toastT;
function toast(txt){const t=document.getElementById('toast');document.getElementById('toast-text').textContent=txt;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000);}
function exportCsv(name,rows){if(!rows||!rows.length){toast('Немає даних для експорту');return;}const cols=Object.keys(rows[0]);const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`smr_${name}.csv`;a.click();URL.revokeObjectURL(url);audit('Експорт CSV',name);toast('Експорт: smr_'+name+'.csv');}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
