<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1024" />
<title>Sport Market Review — Адмінка</title>
<style>
  :root{
    --bg:#F4F6FA; --surface:#FFFFFF; --ink:#16181D; --dim:#5C6370; --muted:#9AA1AE;
    --line:#E6E8EE; --accent:#2F6BFF; --accentSoft:#EAF0FF; --dark:#12141A; --darkline:#242833;
    --ok:#0F7B4E; --okbg:#E4F5EC; --warn:#8A5A00; --warnbg:#FBF0DA; --danger:#B42318; --dangerbg:#FBE9E7;
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#e9f0ff,#f4f6fa)}
  .login-card{width:420px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 30px 80px rgba(16,18,24,.08)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .brand b{font-size:16px;letter-spacing:-.3px}
  .login-card h1{font-size:20px;letter-spacing:-.4px;margin:16px 0 4px}
  .login-card p.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:600;color:var(--dim);margin:12px 0 6px}
  input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;color:var(--ink);outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .btn{height:44px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;width:100%;margin-top:18px}
  .btn.secondary{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .err{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:10px;min-height:16px}
  .quick{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  .quick .q-title{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
  .quick .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .quick button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;text-align:left;font-size:12px;font-weight:600;color:var(--ink)}
  .quick button:hover{border-color:var(--accent);background:var(--accentSoft)}

  /* Shell */
  #app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  aside{background:var(--dark);color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  aside .brand b{color:#fff}
  aside .brand .logo{background:var(--accent)}
  nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;overflow:auto}
  nav a{display:flex;align-items:center;gap:11px;color:#AEB4C2;text-decoration:none;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600}
  nav a .ico{width:18px;text-align:center;opacity:.9}
  nav a:hover{background:var(--darkline);color:#fff}
  nav a.active{background:var(--accent);color:#fff}
  nav a .badge{margin-left:auto;background:#E0532B;color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 7px}
  nav a.active .badge{background:rgba(255,255,255,.25)}
  .side-foot{margin-top:auto;border-top:1px solid var(--darkline);padding-top:14px}
  .side-user{display:flex;align-items:center;gap:10px}
  .side-user .av{width:34px;height:34px;border-radius:8px;background:var(--darkline);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .side-user .nm{font-size:12.5px;font-weight:700}
  .side-user .rl{font-size:11px;color:#8892A6}
  .side-foot button{margin-top:12px;width:100%;background:transparent;border:1px solid var(--darkline);color:#AEB4C2;border-radius:9px;padding:9px;font-size:12.5px;font-weight:600}
  .side-foot button:hover{color:#fff;border-color:#3a4150}

  main{padding:26px 30px;overflow:auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .topbar h2{font-size:22px;letter-spacing:-.5px}
  .topbar .sub{color:var(--dim);font-size:13px;margin-top:3px}
  .role-pill{background:var(--accentSoft);color:var(--accent);font-weight:700;font-size:11.5px;border-radius:999px;padding:5px 11px}

  /* Dashboard */
  .grid-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .metric .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
  .metric .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:8px}
  .metric .d{font-size:11.5px;font-weight:700;margin-top:4px}
  .metric .d.up{color:var(--ok)} .metric .d.flat{color:var(--muted)}
  .section-title{font-size:13px;font-weight:800;letter-spacing:.2px;margin:26px 0 12px;color:var(--ink)}
  .attention{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .attention .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
  .attention .row:first-child{border-top:none}
  .attention .row .ic{width:34px;height:34px;border-radius:9px;background:var(--warnbg);color:var(--warn);display:flex;align-items:center;justify-content:center;font-size:15px}
  .attention .row .t{font-weight:700;font-size:13.5px}
  .attention .row .s{font-size:12px;color:var(--dim)}
  .attention .row .cnt{margin-left:auto;font-weight:800;font-size:16px}
  .attention .row .go{margin-left:14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--accent)}

  /* Table */
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input.search{width:240px;height:38px}
  .toolbar select{width:auto;height:38px;padding:0 30px 0 12px}
  .toolbar .spacer{flex:1}
  .toolbar .tbtn{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--ink)}
  .toolbar .tbtn.primary{background:var(--accent);color:#fff;border:none}
  .toolbar .tbtn.warn{color:var(--warn)} .toolbar .tbtn.danger{color:var(--danger)}
  .toolbar .tbtn[disabled]{opacity:.4;cursor:not-allowed}
  .card-table{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--muted);text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line);background:#FBFCFE}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FBFCFE}
  td .name{font-weight:700}
  td .meta{color:var(--dim);font-size:12px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .badge2{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.3px;border-radius:6px;padding:3px 8px;text-transform:uppercase}
  .b-ok{background:var(--okbg);color:var(--ok)} .b-warn{background:var(--warnbg);color:var(--warn)}
  .b-danger{background:var(--dangerbg);color:var(--danger)} .b-info{background:var(--accentSoft);color:var(--accent)}
  .b-neutral{background:#EEF0F4;color:var(--dim)}
  .rowact{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:700;color:var(--ink);margin-left:6px}
  .rowact.ok{color:var(--ok)} .rowact.dg{color:var(--danger)}
  .empty{padding:48px;text-align:center;color:var(--muted);font-weight:600;font-size:13.5px}

  /* Modal */
  #modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(16,18,24,.45);z-index:60}
  #modal-root.show{display:flex}
  .modal{width:440px;background:var(--surface);border-radius:16px;padding:24px}
  .modal h3{font-size:18px;letter-spacing:-.3px}
  .modal p{color:var(--dim);font-size:13.5px;line-height:1.5;margin-top:8px}
  .modal textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;margin-top:12px;outline:none;resize:vertical}
  .modal .row{display:flex;gap:10px;margin-top:18px}
  .modal .row button{flex:1;height:42px;border-radius:10px;font-weight:700;font-size:13.5px}
  .modal .row .c{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .modal .row .a{background:var(--accent);color:#fff;border:none}
  .modal .row .a.danger{background:var(--danger)}

  /* Toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:12px 18px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:70;display:flex;gap:9px;align-items:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .dot{width:8px;height:8px;border-radius:4px;background:#3FC77E}

  .notecell{color:var(--dim);font-size:12px;font-style:italic}
  .notrole{padding:60px;text-align:center;color:var(--muted)}
  .notrole b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="brand"><div class="logo">SM</div><b>Sport Market Review</b></div>
    <h1>Адміністративна панель</h1>
    <p class="sub">Захищений доступ для команди SMR. Увійдіть службовим акаунтом.</p>
    <label>Робочий email</label>
    <input id="li-email" type="email" placeholder="you@smr.ua" autocomplete="username" />
    <label>Пароль</label>
    <input id="li-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    <div class="err" id="li-err"></div>
    <button class="btn" onclick="doLogin()">Увійти</button>
    <div class="quick">
      <div class="q-title">ДЕМО-АКАУНТИ (пароль: smr2026)</div>
      <div class="grid" id="quick-grid"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside>
    <div class="brand"><div class="logo">SM</div><b>SMR Admin</b></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="side-user"><div class="av" id="su-av"></div><div><div class="nm" id="su-name"></div><div class="rl" id="su-role"></div></div></div>
      <button onclick="doLogout()">Вийти</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div><h2 id="page-title"></h2><div class="sub" id="page-sub"></div></div>
      <div class="role-pill" id="role-pill"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modal-root"><div class="modal" id="modal"></div></div>
<div id="toast"><div class="dot"></div><span id="toast-text"></span></div>

<script>
/* ============ ДАНІ (демо) ============ */
const ACCOUNTS = {
  'super@smr.ua':    {name:'Ірина Адмін',      role:'super_admin'},
  'editor@smr.ua':   {name:'Олег Редактор',    role:'editor'},
  'moderator@smr.ua':{name:'Марія Модератор',  role:'moderator'},
  'partner@smr.ua':  {name:'Данило Партнер',   role:'partnership_manager'},
  'events@smr.ua':   {name:'Катерина Івенти',  role:'event_manager'},
  'analyst@smr.ua':  {name:'Андрій Аналітик',  role:'analyst'},
};
const PASSWORD = 'smr2026';
const ROLE_LABEL = {
  super_admin:'Super Admin', editor:'Editor', moderator:'Moderator',
  partnership_manager:'Partnership Manager', event_manager:'Event Manager', analyst:'Analyst'
};
// Матриця доступу: які секції бачить роль
const PERMS = {
  super_admin:['dashboard','users','organizations','articles','opportunities','events','registrations','introductions','reports','analytics','audit','settings'],
  editor:['dashboard','articles'],
  moderator:['dashboard','users','organizations','opportunities','events','reports'],
  partnership_manager:['dashboard','introductions'],
  event_manager:['dashboard','events','registrations'],
  analyst:['dashboard','analytics','audit'],
};
const NAV = [
  {key:'dashboard',label:'Дашборд',ico:'▣'},
  {key:'users',label:'Користувачі',ico:'👤'},
  {key:'organizations',label:'Організації',ico:'🏢'},
  {key:'articles',label:'Матеріали',ico:'📄'},
  {key:'opportunities',label:'Можливості',ico:'💼'},
  {key:'events',label:'Події',ico:'📅'},
  {key:'registrations',label:'Реєстрації',ico:'🎟'},
  {key:'introductions',label:'Знайомства',ico:'🤝'},
  {key:'reports',label:'Скарги',ico:'🚩'},
  {key:'analytics',label:'Аналітика',ico:'📊'},
  {key:'audit',label:'Аудит',ico:'🧾'},
  {key:'settings',label:'Налаштування',ico:'⚙'},
];

// Сутності
const USERS = [
  {id:'u1',name:'Олена Ковальчук',email:'olena@club.ua',role:'Представник організації',status:'active',verified:true,profile:100,created:'12.07'},
  {id:'u2',name:'Андрій Мельник',email:'andrii@media.ua',role:'Фахівець',status:'active',verified:true,profile:90,created:'14.07'},
  {id:'u3',name:'Данило Бондар',email:'dbondar@bet.pl',role:'Фахівець',status:'active',verified:false,profile:70,created:'18.07'},
  {id:'u4',name:'Марія Ткаченко',email:'maria@student.ua',role:'Студент',status:'active',verified:false,profile:45,created:'22.07'},
  {id:'u5',name:'Ігор Спам',email:'spam@x.co',role:'Інше',status:'pending',verified:false,profile:20,created:'26.07'},
  {id:'u6',name:'Blocked User',email:'blocked@smr.ua',role:'Фахівець',status:'suspended',verified:false,profile:30,created:'02.06'},
];
const ORGS = [
  {id:'o1',name:'ФК «Динамо» Київ',type:'Клуб',city:'Київ',status:'verified'},
  {id:'o2',name:'Українська асоціація футболу',type:'Федерація',city:'Київ',status:'verified'},
  {id:'o3',name:'Favbet',type:'Бренд',city:'Київ',status:'pending'},
  {id:'o4',name:'MEGOGO Sport',type:'Медіа',city:'Львів',status:'verified'},
  {id:'o5',name:'Нова агенція',type:'Агентство',city:'Одеса',status:'pending'},
];
const ARTICLES = [
  {id:'a1',title:'Nike запускає кампанію навколо жіночого футболу',type:'Новина',status:'published',author:'Марія Левченко',date:'24.07'},
  {id:'a2',title:'Як банк зібрав повний стадіон',type:'Кейс',status:'published',author:'Ірина Савченко',date:'22.07'},
  {id:'a7',title:'Інтервʼю: комерційна модель федерації',type:'Інтервʼю',status:'draft',author:'Редакція SMR',date:'—'},
  {id:'a9',title:'Гайд: оцінка спонсорського інвентарю',type:'Гайд',status:'draft',author:'Редакція SMR',date:'—'},
];
const OPPS = [
  {id:'op1',title:'Head of Sponsorship у клуб',org:'ФК «Динамо» Київ',type:'Вакансія',status:'published',apps:3},
  {id:'op2',title:'Титульне партнерство ліги',org:'УПЛ',type:'Партнерство',status:'published',apps:5},
  {id:'op7',title:'Тендер на кейтеринг матчдей',org:'Нова агенція',type:'Тендер',status:'pending',apps:0},
  {id:'op8',title:'Пошук амбасадора бренду',org:'Favbet',type:'Пошук амбасадора',status:'pending',apps:0},
];
const EVENTS = [
  {id:'e1',title:'Sport Business Forum Ukraine 2026',date:'12.09',status:'published',regs:342,format:'Офлайн'},
  {id:'e2',title:'Практикум для клубів',date:'24.09',status:'published',regs:200,format:'Онлайн'},
  {id:'e9',title:'Новий воркшоп (на модерації)',date:'05.10',status:'pending',regs:0,format:'Онлайн'},
];
const REGS = [
  {id:'r1',user:'Олена Ковальчук',event:'Sport Business Forum 2026',status:'registered',date:'20.07'},
  {id:'r2',user:'Данило Бондар',event:'Практикум для клубів',status:'waitlist',date:'21.07'},
  {id:'r3',user:'Марія Ткаченко',event:'Sport Business Forum 2026',status:'cancelled',date:'22.07'},
];
const INTROS = [
  {id:'i1',from:'fintech-бренд',to:'УАФ',reason:'Спонсорство',status:'moreinfo'},
  {id:'i2',from:'Олена Ковальчук',to:'Андрій Мельник',reason:'Партнерство',status:'new'},
  {id:'i3',from:'Данило Бондар',to:'ФК «Динамо»',reason:'Співпраця',status:'review'},
];
const REPORTS = [
  {id:'rp1',target:'Ігор Спам',type:'Профіль',reason:'Спам або реклама',status:'open'},
  {id:'rp2',target:'Нова агенція',type:'Організація',reason:'Недостовірна інформація',status:'open'},
];

/* ============ СТАН ============ */
let SESSION = null;
let CUR = 'dashboard';
const NOTES = {};        // entityId -> note
const SELECTED = new Set();
const AUDIT_KEY='smr_admin_audit';
const loadAudit = () => { try{return JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]')}catch{return[]} };
const saveAudit = (a) => localStorage.setItem(AUDIT_KEY, JSON.stringify(a));
function audit(action, target){
  const a = loadAudit();
  a.unshift({ts:Date.now(), actor:SESSION?SESSION.email:'—', role:SESSION?ROLE_LABEL[SESSION.role]:'—', action, target:target||'—'});
  saveAudit(a.slice(0,500));
}

/* ============ AUTH ============ */
function renderQuick(){
  const g = document.getElementById('quick-grid');
  g.innerHTML = Object.entries(ACCOUNTS).map(([email,a])=>
    `<button onclick="quickFill('${email}')"><div>${ROLE_LABEL[a.role]}</div></button>`).join('');
}
function quickFill(email){ document.getElementById('li-email').value=email; document.getElementById('li-pass').value=PASSWORD; }
function doLogin(){
  const email=document.getElementById('li-email').value.trim().toLowerCase();
  const pass=document.getElementById('li-pass').value;
  const err=document.getElementById('li-err');
  const acc=ACCOUNTS[email];
  if(!acc){ err.textContent='Невідомий службовий акаунт'; return; }
  if(pass!==PASSWORD){ err.textContent='Невірний пароль'; return; }
  err.textContent='';
  SESSION={email,...acc};
  audit('Вхід у систему','');
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  mountShell();
  CUR = 'dashboard';
  go('dashboard');
}
function doLogout(){ audit('Вихід',''); SESSION=null; document.getElementById('app').classList.add('hidden'); document.getElementById('login').classList.remove('hidden'); document.getElementById('li-pass').value=''; }

/* ============ SHELL ============ */
function mountShell(){
  const allowed = PERMS[SESSION.role];
  document.getElementById('nav').innerHTML = NAV.filter(n=>allowed.includes(n.key)).map(n=>{
    const att = attentionCount(n.key);
    return `<a href="#" data-k="${n.key}" onclick="go('${n.key}');return false"><span class="ico">${n.ico}</span>${n.label}${att?`<span class="badge">${att}</span>`:''}</a>`;
  }).join('');
  const initials = SESSION.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  document.getElementById('su-av').textContent=initials;
  document.getElementById('su-name').textContent=SESSION.name;
  document.getElementById('su-role').textContent=ROLE_LABEL[SESSION.role];
  document.getElementById('role-pill').textContent=ROLE_LABEL[SESSION.role];
}
function attentionCount(key){
  if(key==='users') return USERS.filter(u=>u.status==='pending').length;
  if(key==='organizations') return ORGS.filter(o=>o.status==='pending').length;
  if(key==='opportunities') return OPPS.filter(o=>o.status==='pending').length;
  if(key==='events') return EVENTS.filter(e=>e.status==='pending').length;
  if(key==='reports') return REPORTS.filter(r=>r.status==='open').length;
  if(key==='introductions') return INTROS.filter(i=>i.status==='moreinfo').length;
  return 0;
}
function go(key){
  if(!PERMS[SESSION.role].includes(key)){ renderNoAccess(); return; }
  CUR=key; SELECTED.clear();
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===key));
  const meta=NAV.find(n=>n.key===key);
  document.getElementById('page-title').textContent=meta.label;
  document.getElementById('page-sub').textContent=SUBTITLES[key]||'';
  audit('Перегляд розділу', meta.label);
  VIEWS[key]();
}
const SUBTITLES={

function auditRow(x){ return `<tr><td class="meta">${new Date(x.ts).toLocaleString('uk-UA')}</td><td><div class="name">${x.actor}</div></td><td>${x.role}</td><td>${x.action}</td><td class="meta">${x.target}</td></tr>`; }
function filterAudit(q){ q=q.toLowerCase(); const a=loadAudit().filter(x=>(x.actor+x.action+x.target).toLowerCase().includes(q)); document.getElementById('audit-body').innerHTML=a.length?a.map(auditRow).join(''):`<tr><td colspan="5" class="empty">Нічого не знайдено</td></tr>`; }

/* ============ TABLE ENGINE ============ */
let TSTATE={};
function table(cfg){
  TSTATE={cfg,q:'',filter:''};
  renderTable();
}
function renderTable(){
  const {cfg}=TSTATE;
  let rows=cfg.rows.slice();
  if(TSTATE.q){ const q=TSTATE.q.toLowerCase(); rows=rows.filter(r=>cfg.search(r).toLowerCase().includes(q)); }
  if(TSTATE.filter){ rows=rows.filter(r=>r.status===TSTATE.filter); }
  const f=cfg.filters&&cfg.filters[0];
  const anySel=SELECTED.size>0;
  V.innerHTML=`
    <div class="toolbar">
      <input class="search" placeholder="Пошук…" value="${TSTATE.q}" oninput="tSearch(this.value)"/>
      ${f?`<select onchange="tFilter(this.value)"><option value="">Усі статуси</option>${f.opts.map(o=>`<option ${TSTATE.filter===o?'selected':''} value="${o}">${o}</option>`).join('')}</select>`:''}
      <div class="spacer"></div>
      ${(cfg.bulk||[]).map((b,i)=>`<button class="tbtn ${i===1?'danger':''}" ${anySel?'':'disabled'} onclick="bulk('${b}')">${b} ${anySel?`(${SELECTED.size})`:''}</button>`).join('')}
      <button class="tbtn" onclick="exportCsv('${CUR}',TSTATE.cfg.rows)">Експорт CSV</button>
    </div>
    <div class="card-table"><table>
      <thead><tr><th style="width:36px"><input type="checkbox" ${rows.length&&rows.every(r=>SELECTED.has(r.id))?'checked':''} onchange="selAll(this.checked)"/></th>
      ${cfg.cols.map(c=>`<th>${c}</th>`).join('')}<th style="text-align:right">Дії</th></tr></thead>
      <tbody>${rows.length?rows.map(r=>`<tr><td><input type="checkbox" ${SELECTED.has(r.id)?'checked':''} onchange="selRow('${r.id}',this.checked)"/></td>${cfg.cell(r)}
        <td style="text-align:right;white-space:nowrap">${cfg.actions?cfg.actions(r):''}</td></tr>
        ${NOTES[r.id]?`<tr><td></td><td colspan="${cfg.cols.length+1}"><span class="notecell">📝 Нотатка: ${NOTES[r.id]}</span></td></tr>`:''}`).join(''):`<tr><td colspan="${cfg.cols.length+2}" class="empty">Нічого не знайдено</td></tr>`}
      </tbody></table></div>`;
}
function tSearch(v){ TSTATE.q=v; renderTable(); }
function tFilter(v){ TSTATE.filter=v; renderTable(); }
function selRow(id,on){ on?SELECTED.add(id):SELECTED.delete(id); renderTable(); }
function selAll(on){ const {cfg}=TSTATE; cfg.rows.forEach(r=>on?SELECTED.add(r.id):SELECTED.delete(r.id)); renderTable(); }
function bulk(label){
  confirmModal(label+'?', `Дію буде застосовано до ${SELECTED.size} записів.`, ()=>{
    audit('Масова дія: '+label, SELECTED.size+' записів');
    SELECTED.clear(); toast(label+' — виконано'); renderTable();
  });
}

/* ============ ACTIONS ============ */
function act(action,target){ audit(action,target); toast(action); if(TSTATE.cfg) renderTable(); }
function confirmAct(title,target,action){ confirmModal(title,'Підтвердьте дію — вона буде записана в аудит.',()=>{ audit(action,target); toast(action); if(TSTATE.cfg)renderTable(); },true); }
function noteFor(id,name){
  openModal(`<h3>Внутрішня нотатка</h3><p>${name} · видима лише команді</p>
    <textarea id="note-in" placeholder="Напр.: перевірити звʼязок з організацією">${NOTES[id]||''}</textarea>
    <div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a" onclick="saveNote('${id}','${name}')">Зберегти</button></div>`);
  setTimeout(()=>document.getElementById('note-in').focus(),50);
}
function saveNote(id,name){ const v=document.getElementById('note-in').value.trim(); NOTES[id]=v; audit('Внутрішня нотатка',name); closeModal(); toast('Нотатку збережено'); if(TSTATE.cfg)renderTable(); }

/* ============ MODAL / TOAST ============ */
function openModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modal-root').classList.add('show'); }
function closeModal(){ document.getElementById('modal-root').classList.remove('show'); }
function confirmModal(title,msg,onOk,danger){
  openModal(`<h3>${title}</h3><p>${msg}</p><div class="row"><button class="c" onclick="closeModal()">Скасувати</button><button class="a ${danger?'danger':''}" id="cm-ok">Підтвердити</button></div>`);
  document.getElementById('cm-ok').onclick=()=>{ closeModal(); onOk(); };
}
let toastT;
function toast(txt){ const t=document.getElementById('toast'); document.getElementById('toast-text').textContent=txt; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2000); }

/* ============ EXPORT ============ */
function exportCsv(name,rows){
  if(!rows||!rows.length){ toast('Немає даних для експорту'); return; }
  const cols=Object.keys(rows[0]);
  const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`smr_${name}.csv`; a.click(); URL.revokeObjectURL(url);
  audit('Експорт CSV',name); toast('Експорт готовий: smr_'+name+'.csv');
}
