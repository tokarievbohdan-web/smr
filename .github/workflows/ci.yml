name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATA_MODE: mock
          APP_ENV: development

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save @electric-sql/pglite@latest
      - run: node supabase/tests/regression.mjs

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # secret scan: службовий JWT service_role не має бути в трекнутих файлах
      - name: Secret scan (service_role JWT)
        run: |
          if git grep -nE '"role":"service_role"|eyJ[A-Za-z0-9_-]{20,}\.eyJ[A-Za-z0-9_-]{40,}' -- . ':!*.example' ':!.github/**' ':!**/CHANGELOG*'; then
            echo "::error::Можливий секрет у репозиторії"; exit 1; fi
      # міграції: імена впорядковані й унікальні
      - name: Migration naming
        run: |
          ls supabase/migrations | grep -E '^[0-9]{14}_.+\.sql$' >/dev/null || { echo "bad migration name"; exit 1; }
